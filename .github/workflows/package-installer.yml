# Build an unofficial Clean Flash Player installer from this MIT wrapper
# plus a payload published on darktohka/clean-flash-builds.
#
# Run it from the Actions tab: "Package installer" → Run workflow.
# builds_tag and flash_version must be filled in; there are no defaults.
# A successful build publishes a GitHub Release (and tag) named after
# flash_version, marked unofficial. It will not overwrite an existing tag.
name: Package installer

on:
  workflow_dispatch:
    inputs:
      builds_tag:
        description: clean-flash-builds release tag (required, no default)
        required: true
        type: string
      flash_version:
        description: Flash version, also used as the GitHub Release tag (required, no default; for example 34.0.0.376)
        required: true
        type: string
      payload_asset:
        description: Payload asset name (leave empty to use ChineseFlash-Patched-Win-<version>.7z)
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Check required inputs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BUILDS_TAG: ${{ inputs.builds_tag }}
          INPUT_FLASH_VERSION: ${{ inputs.flash_version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = "$env:INPUT_BUILDS_TAG".Trim()
          $ver = "$env:INPUT_FLASH_VERSION".Trim()
          if (-not $tag) { throw "builds_tag is required and cannot be empty." }
          if (-not $ver) { throw "flash_version is required and cannot be empty." }
          if ($ver -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "flash_version must look like 34.0.0.376, got '$ver'"
          }
          gh release view $ver --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "GitHub Release '$ver' already exists. Choose a new flash_version, or delete that release first."
          }
          gh api "repos/${{ github.repository }}/git/ref/tags/$ver" 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Git tag '$ver' already exists on this repo (for example an official backup tag). Choose a new flash_version; this workflow will not overwrite existing tags."
          }
          Write-Host "inputs ok: builds_tag=$tag flash_version=$ver"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install 7-Zip
        run: choco install 7zip --no-progress -y

      - name: Package installer
        shell: pwsh
        env:
          INPUT_BUILDS_TAG: ${{ inputs.builds_tag }}
          INPUT_FLASH_VERSION: ${{ inputs.flash_version }}
          INPUT_PAYLOAD_ASSET: ${{ inputs.payload_asset }}
        run: |
          $tag = "$env:INPUT_BUILDS_TAG".Trim()
          $ver = "$env:INPUT_FLASH_VERSION".Trim()
          $asset = "$env:INPUT_PAYLOAD_ASSET".Trim()
          ./scripts/package-windows.ps1 `
            -FlashVersion $ver `
            -BuildsTag $tag `
            -PayloadAsset $asset `
            -RepoRoot "${{ github.workspace }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CleanFlash_${{ inputs.flash_version }}_Installer
          path: |
            artifacts/*.exe
            artifacts/*.7z
            artifacts/*.sha256
            artifacts/*.md
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BUILDS_TAG: ${{ inputs.builds_tag }}
          INPUT_FLASH_VERSION: ${{ inputs.flash_version }}
        run: |
          $tag = "$env:INPUT_BUILDS_TAG".Trim()
          $ver = "$env:INPUT_FLASH_VERSION".Trim()
          $buildNotes = Get-Content -LiteralPath "$env:GITHUB_WORKSPACE\artifacts\BUILD-NOTES.md" -Raw
          $notesPath = "$env:GITHUB_WORKSPACE\artifacts\RELEASE-NOTES.md"
          @(
            "This is an **unofficial** build from this backup repository. It is not a release from gitlab.com/cleanflash/installer or cdn.cleanflash.org."
            ""
            "- Flash version: ``$ver``"
            "- clean-flash-builds tag: ``$tag``"
            "- Built by the Package installer workflow on windows-latest (MSBuild Release + ILRepack)"
            ""
            $buildNotes
          ) -join "`n" | Set-Content -LiteralPath $notesPath -Encoding utf8

          gh release create $ver `
            "$env:GITHUB_WORKSPACE\artifacts\CleanFlash_${ver}_Installer.exe" `
            "$env:GITHUB_WORKSPACE\artifacts\cleanflash-$ver.7z" `
            "$env:GITHUB_WORKSPACE\artifacts\FlashUtil_Uninstall.exe" `
            "$env:GITHUB_WORKSPACE\artifacts\checksums.sha256" `
            "$env:GITHUB_WORKSPACE\artifacts\BUILD-NOTES.md" `
            --title "Clean Flash Player $ver (unofficial)" `
            --notes-file $notesPath
